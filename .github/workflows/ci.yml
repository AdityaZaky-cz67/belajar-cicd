name: Pipeline CI dan CD

on:
  push:
    branches:
      - main

jobs:
  proses-ci-dan-cd:
    runs-on: self-hosted

    steps:
      - name: Ambil Kode dari GitHub
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validasi HTML
        shell: powershell
        run: npx --yes htmlhint "**/*.html"

      - name: Deploy ke Vercel
        shell: powershell
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel --prod --token "$env:VERCEL_TOKEN" --scope "$env:VERCEL_ORG_ID" --project "$env:VERCEL_PROJECT_ID" --confirm