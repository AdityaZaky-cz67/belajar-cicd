name: Pipeline CI dan CD

on:
  push:
    branches: [ main ]

jobs:
  proses-ci-dan-cd:
    runs-on: self-hosted
    steps:
      - name: Ambil Kode dari GitHub
        uses: actions/checkout@v4

      # --- INI PROSES CI (Pengecekan) ---
      - name: Install Alat Penguji HTML
        run: npm install htmlhint

      # UBAH BARIS INI: Panggil langsung dari folder lokal node_modules
      - name: Mulai Uji Semua File HTML
        run: ./node_modules/.bin/htmlhint "**/*.html"

      # --- INI PROSES CD (Pengiriman ke Server) ---
      - name: Hapus .vercel Directory
        run: rm -rf .vercel

      - name: Pasang Website Otomatis ke Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: "team_9FGHvBNlA4p6vjqfYofksAsl"
          vercel-project-id: "prj_8OEFcouq8w4bJiBBYHoLfp9ZamRr"
          vercel-args: '--prod'

