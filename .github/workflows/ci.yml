name: Pipeline CI dan CD

on:
  push:
    branches:
      - main

jobs:
  proses-ci-dan-cd:
    runs-on: self-hosted

    steps:
      - name: Ambil Kode dari GitHub
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Alat Penguji HTML
        run: npm install htmlhint

      - name: Mulai Uji Semua File HTML
        shell: pwsh
        run: npx htmlhint "**/*.html"

      - name: Hapus .vercel Directory
        shell: pwsh
        run: |
          if (Test-Path ".vercel") {
            Remove-Item -Path ".vercel" -Recurse -Force
          }

      - name: Pasang Website Otomatis ke Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"